name: Restore UI validation

on:
  push:
    branches:
      - agent/restore-live-ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full test suite
        run: npm test
      - name: Check changed JavaScript syntax
        run: |
          node --check app.js
          node --check js/api-client.js
          node --check js/list-item-cache.js
          node --check js/nuvio-export.js
          node --check js/nuvio-export-ui.js
          node --check functions/api/trakt.js
          node --check functions/lib/trakt-client.js
          node --check tests/nuvio-export.test.mjs
          node --check tests/trakt-api-handler.test.mjs
