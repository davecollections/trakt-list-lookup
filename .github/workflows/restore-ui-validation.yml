name: Restore UI validation

on:
  push:
    branches:
      - agent/restore-live-ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run full validation
        run: |
          npm test
          npm run check
