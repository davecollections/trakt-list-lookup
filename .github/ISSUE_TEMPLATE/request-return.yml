name: Request Trakt List Lookup to return
description: Let me know if you used the tool, or would like to use it if it returns.
title: "[Interest] Bring back Trakt List Lookup"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking a moment to let me know. Trakt List Lookup is currently unavailable following changes to Trakt's developer API access requirements.

        These responses will help me decide whether there is enough interest to justify reinstating and maintaining the tool.

  - type: dropdown
    id: interest-type
    attributes:
      label: Which best describes you?
      options:
        - I used the tool and would like to see it return.
        - I didn't use it before, but I'd like to use it if it returns.
    validations:
      required: true

  - type: checkboxes
    id: useful-features
    attributes:
      label: What would you find useful?
      description: Optional — select any that apply.
      options:
        - label: Searching public Trakt lists by keyword
        - label: Searching by Trakt username
        - label: Looking up a list by URL or ID
        - label: Browsing popular or trending lists
        - label: Previewing list items and posters
        - label: Creating Nuvio-compatible JSON

  - type: textarea
    id: comments
    attributes:
      label: Anything else you'd like to add?
      description: Optional — a short note about how you used the tool, or how you would use it, is helpful.
      placeholder: I mainly used it to... / I'd mainly use it to...
